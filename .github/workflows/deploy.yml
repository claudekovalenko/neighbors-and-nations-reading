name: Test & deploy

# Every update is checked before it can go live:
#   test    — unit tests + series file checks
#   devices — the app on simulated Android phones (Chrome engine), iPhones
#             and iPad (Safari engine) and desktop; screenshots of every
#             screen are saved in the "device-report" download on the run.
#   deploy  — publishes to GitHub Pages, only from main and only if both pass.
#             Also runs every morning so the calendar files (cal/) start today.
#   refresh — the morning run: scheduled runs start from the repo's default
#             branch, which can't publish, so it re-runs this workflow on main.
# Runners are pinned to ubuntu-24.04: Playwright 1.56 can't install its
# browsers on newer Ubuntu ("ubuntu-latest" moved to 26.04 in Nov 2026).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '7 8 * * *' # every morning (≈4am US Eastern): refresh the calendar files

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - run: gh workflow run deploy.yml --ref main --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

  test:
    if: github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run validate

  devices:
    if: github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-report
          path: playwright-report/
          retention-days: 30

  deploy:
    # One-time setup: repo Settings → Pages → Source: "GitHub Actions".
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [test, devices]
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run calendars # reminder files, from today on
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
