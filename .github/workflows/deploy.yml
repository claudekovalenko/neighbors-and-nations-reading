name: Test & deploy

# Every update is checked before it can go live:
#   test    — unit tests + series file checks
#   devices — the app on simulated Android phones (Chrome engine), iPhones
#             and iPad (Safari engine) and desktop; screenshots of every
#             screen are saved in the "device-report" download on the run.
#   deploy  — publishes to GitHub Pages, only from main and only if both pass.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run validate

  devices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-report
          path: playwright-report/
          retention-days: 30

  deploy:
    # One-time setup: repo Settings → Pages → Source: "GitHub Actions".
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [test, devices]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
